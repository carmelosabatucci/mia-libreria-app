name: Compilazione Android Buildozer

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Ricezione file del progetto
      uses: actions/checkout@v4

    - name: Pulizia totale vecchi residui
      run: |
        rm -rf .buildozer
        rm -rf bin

    - name: Configurazione ambiente Python 3.14
      uses: actions/setup-python@v5
      with:
        python-version: '3.14.0-alpha.2' # Si allinea perfettamente alla richiesta 3.14.2 del toolchain

    - name: Configurazione Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Installazione dipendenze di sistema e Buildozer Aggiornato
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libsqlite3-dev cmake libgdbm-dev libssl-dev libffi-dev uuid-dev lld
        pip install --upgrade pip
        # Installiamo Buildozer direttamente da master per supportare i nuovi Python
        pip install --upgrade git+https://github.com cython virtualenv

    - name: Compilazione APK Finale
      env:
        ANDROID_REMOTE_ANDROID_SDK_HOME: /home/runner/.android
      run: |
        mkdir -p ~/.android
        touch ~/.android/repositories.cfg
        yes y | buildozer -v android debug
        
    - name: Salvataggio file APK Finale
      uses: actions/upload-artifact@v4
      with:
        name: Applicazione-Pronta
        path: bin/*.apk
