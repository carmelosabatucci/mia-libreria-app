name: Compilazione Android Buildozer

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Ricezione file del progetto
      uses: actions/checkout@v4

    - name: Compilazione APK con Azione Ufficiale Kivy
      uses: artemSBulgakov/action-android-buildozer@v1.3
      with:
        buildozer_version: '1.5.0'
        # Questo comando esegue la pulizia interna automatica prima di compilare
        command: buildozer android debug

    - name: Salvataggio file APK Finale
      uses: actions/upload-artifact@v4
      with:
        name: Applicazione-Pronta
        path: bin/*.apk
