name: Compilazione Android Buildozer

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Ricezione file del progetto
      uses: actions/checkout@v4

    - name: Pulizia totale vecchi residui
      run: |
        rm -rf .buildozer
        rm -rf bin

    - name: Configurazione ambiente Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Configurazione Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Installazione dipendenze di sistema e Buildozer Retro-Compatibile
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libsqlite3-dev cmake libgdbm-dev libssl-dev libffi-dev uuid-dev lld
        pip install --upgrade pip
        # Forziamo una versione stabile e collaudata di Buildozer e python-for-android che non include i bug di Python 3.14
        pip install --upgrade "buildozer==1.5.0" "cython<3.0" virtualenv "python-for-android==2024.01.21"

    - name: Compilazione APK Finale
      env:
        ANDROID_REMOTE_ANDROID_SDK_HOME: /home/runner/.android
      run: |
        # Allineiamo i requisiti del file .spec a una versione compatibile con la release stabile
        sed -i 's/requirements =.*/requirements = python3==3.11.0,kivy/g' buildozer.spec
        
        mkdir -p ~/.android
        touch ~/.android/repositories.cfg
        
        # Avviamo la build imponendo a Buildozer di usare la versione stabile globale
        yes y | buildozer -v android debug --p4a=pythonforandroid
        
    - name: Salvataggio file APK Finale
      uses: actions/upload-artifact@v4
      with:
        name: Applicazione-Pronta
        path: bin/*.apk
