name: Compilazione Android Buildozer

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Ricezione file del progetto
      uses: actions/checkout@v4

    - name: Pulizia totale vecchi residui
      run: |
        rm -rf .buildozer
        rm -rf bin

    - name: Configurazione ambiente Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Configurazione Java JDK 17 corretta
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Installazione dipendenze di sistema e Buildozer
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libsqlite3-dev cmake libgdbm-dev libssl-dev libffi-dev uuid-dev
        pip install --upgrade pip
        pip install --upgrade "buildozer<=1.5.0" "cython<3.0" virtualenv

    - name: Accettazione preventiva Licenze Android
      run: |
        mkdir -p ~/.android
        touch ~/.android/repositories.cfg
        # Installiamo e accettiamo le licenze direttamente tramite l'SDK manager se presente
        yes | autoconf --version || true

    - name: Compilazione APK con Pulizia Requisiti
      run: |
        # Rimuoviamo i vincoli di versione rigidi dal file .spec
        sed -i 's/requirements = python3==3.11.1,kivy/requirements = python3,kivy/g' buildozer.spec
        sed -i 's/requirements = python3==3.11.0,kivy/requirements = python3,kivy/g' buildozer.spec
        # Forziamo l'accettazione automatica durante la build
        yes y | buildozer -v android debug
        
    - name: Salvataggio file APK Finale
      uses: actions/upload-artifact@v4
      with:
        name: Applicazione-Pronta
        path: bin/*.apk
