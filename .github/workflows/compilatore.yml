name: Compilazione Android Buildozer

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Ricezione file del progetto
      uses: actions/checkout@v4

    - name: Pulizia totale vecchi residui
      run: |
        rm -rf .buildozer
        rm -rf bin

    - name: Configurazione ambiente Python 3.14.2 esatto
      uses: actions/setup-python@v5
      with:
        # Installiamo esattamente la versione pretesa dal toolchain di Android
        python-version: '3.14.2'

    - name: Configurazione Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Installazione dipendenze di sistema e Buildozer
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libsqlite3-dev cmake libgdbm-dev libssl-dev libffi-dev uuid-dev lld
        pip install --upgrade pip
        # Usiamo l'ultima versione di Buildozer compatibile con i nuovi standard Python
        pip install --upgrade buildozer cython virtualenv python-for-android

    - name: Compilazione APK Finale
      env:
        ANDROID_REMOTE_ANDROID_SDK_HOME: /home/runner/.android
      run: |
        # Allineiamo al millimetro il file buildozer.spec alla versione richiesta
        sed -i 's/requirements =.*/requirements = python3==3.14.2,kivy/g' buildozer.spec
        
        mkdir -p ~/.android
        touch ~/.android/repositories.cfg
        
        # Avvio della build definitiva
        yes y | buildozer -v android debug
        
    - name: Salvataggio file APK Finale
      uses: actions/upload-artifact@v4
      with:
        name: Applicazione-Pronta
        path: bin/*.apk
