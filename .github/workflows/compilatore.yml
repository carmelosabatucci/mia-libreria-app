name: Compilazione Android Buildozer

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Ricezione file del progetto
      uses: actions/checkout@v4

    - name: Pulizia totale vecchi residui
      run: |
        rm -rf .buildozer
        rm -rf bin

    - name: Configurazione ambiente Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Installazione dipendenze di sistema aggiornate
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libsqlite3-dev cmake libgdbm-dev libssl-dev libffi-dev uuid-dev
        pip install --upgrade pip
        pip install --upgrade "buildozer" "cython<3.0" virtualenv

    - name: Compilazione APK con Python 3.11
      run: |
        yes y | buildozer -v android debug
        
    - name: Salvataggio file APK Finale
      uses: actions/upload-artifact@v4
      with:
        name: Applicazione-Pronta
        path: bin/*.apk
