name: Compilazione Android Buildozer

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Ricezione file del progetto
      uses: actions/checkout@v4

    - name: Pulizia totale vecchi residui
      run: |
        rm -rf .buildozer
        rm -rf bin

    - name: Configurazione ambiente Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Configurazione Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Installazione dipendenze di sistema e Buildozer stabile
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libsqlite3-dev cmake libgdbm-dev libssl-dev libffi-dev uuid-dev lld
        pip install --upgrade pip
        pip install --upgrade "buildozer==1.5.0" "cython<3.0" virtualenv

    - name: Compilazione APK Autogestita
      env:
        ANDROID_REMOTE_ANDROID_SDK_HOME: /home/runner/.android
      run: |
        sed -i 's/requirements = python3==3.11.1,kivy/requirements = python3,kivy/g' buildozer.spec
        sed -i 's/requirements = python3==3.11.0,kivy/requirements = python3,kivy/g' buildozer.spec
        mkdir -p ~/.android
        touch ~/.android/repositories.cfg
        yes y | buildozer -v android debug
        
    - name: Salvataggio file APK Finale
      uses: actions/upload-artifact@v4
      with:
        name: Applicazione-Pronta
        path: bin/*.apk
